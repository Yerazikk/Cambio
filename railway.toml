# One service: the Node server builds the client and then serves it alongside
# the WebSocket endpoint, so the page and its socket always share an origin.
[build]
builder = "NIXPACKS"
buildCommand = "npm ci && npm run build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
